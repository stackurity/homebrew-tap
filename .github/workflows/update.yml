name: update

# Keeps Formula/stackurity.rb on the latest Stackurity release. A new formula
# is committed only after its checksums' Sigstore signature verified and it
# installed and passed `brew test` on macOS and Linux.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Release to package (default latest), for example v0.3.1
        default: ""
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.gen.outputs.changed }}
      version: ${{ steps.gen.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: gen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(./scripts/update.sh "${{ inputs.version }}")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: Formula/stackurity.rb

  test:
    needs: generate
    if: needs.generate.outputs.changed == 'true' || github.event_name == 'push'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula
      - name: Install and test
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          git -c user.name=ci -c user.email=ci@example.com commit -qam test --allow-empty
          brew tap stackurity/tap "$GITHUB_WORKSPACE"
          brew install stackurity/tap/stackurity
          brew test stackurity/tap/stackurity
          stackurity --version

  commit:
    needs: [generate, test]
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula
      - run: |
          set -euo pipefail
          git config user.name "stackurity-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/stackurity.rb
          git commit -m "stackurity ${{ needs.generate.outputs.version }}"
          git push
